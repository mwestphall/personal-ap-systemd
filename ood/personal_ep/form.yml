---
cluster: "*" # Glob: show a dropdown of every cluster configured on this OOD instance.
form:
  - base_dir

attributes:
  base_dir:
    widget: text_field
    label: "Base install directory"
    value: ""
    help: >-
      Directory to create this EP's working directory in, on storage shared with the AP's
      node. The EP attaches to the AP at ~/.cache/current-ap. Defaults to /scratch/$USER if
      left blank.
