---
cluster: "*" # Glob: show a dropdown of every cluster configured on this OOD instance.
form:
  - slurm_partition
  - cpus
  - memory
  - time_limit
  - base_dir

attributes:
  slurm_partition:
    widget: text_field
    label: "Slurm partition"
    required: true
  cpus:
    widget: number_field
    label: "CPUs"
    value: 1
    min: 1
  memory:
    widget: number_field
    label: "Memory (GB)"
    value: 2
    min: 1
  time_limit:
    widget: text_field
    label: "Time limit"
    value: "4:00:00"
    help: "Slurm time format, e.g. HH:MM:SS or D-HH:MM:SS. The AP runs only as long as this job does."
  base_dir:
    widget: text_field
    label: "Base install directory"
    value: ""
    help: >-
      Must be on storage shared with the login node. If <base dir>/current-ap exists, that
      AP is resumed; otherwise a fresh AP is installed here (HTCondor is downloaded
      automatically) and current-ap is pointed at it. Defaults to /scratch/$USER if left blank.
